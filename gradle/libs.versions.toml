[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.11.01"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
media3 = "1.11.1"
